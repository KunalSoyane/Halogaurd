[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haloguard"
version = "0.1.0"
description = "Local-first hallucination firewall for LLM applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Kunal Soyane" }]
keywords = ["llm", "hallucination", "nli", "rag", "safety", "onnx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    "platformdirs>=4.0",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
export = [
    "optimum[onnxruntime]>=1.21",
    "sentence-transformers>=3.0,<7",
]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[project.scripts]
haloguard = "haloguard.cli.commands:app"

[project.urls]
Homepage = "https://github.com/KunalSoyane/Halogaurd"
Issues = "https://github.com/KunalSoyane/Halogaurd/issues"
Changelog = "https://github.com/KunalSoyane/Halogaurd/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/haloguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that run real model inference against the golden dataset",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["haloguard"]
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
